<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Market Summary</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 1px;
    }

:root {
  color-scheme: light dark;
  --tv-widget-accent-color: rgba(203, 148, 52, 1);
  --tv-widget-link-color: rgba(203, 148, 52, 1);
  --tv-widget-focus-outline-color: rgba(203, 148, 52, 1);
  --tv-widget-positive-color: rgba(114, 188, 143, 1);
  --tv-widget-positive-area-top-color: rgba(114, 188, 143, 0.4);
  --tv-widget-positive-area-bottom-color: rgba(114, 188, 143, 0.1);
  --tv-widget-negative-color: rgba(233, 115, 102, 1);
  --tv-widget-negative-area-top-color: rgba(233, 115, 102, 0.4);
  --tv-widget-negative-area-bottom-color: rgba(233, 115, 102, 0.1);
  --tv-widget-font-family: Monospace;
  --tv-widget-scale-fill-one: light-dark(rgba(252, 246, 233, 1), rgba(252, 246, 233, 0.5));
  --tv-widget-scale-fill-two: light-dark(#faebd0, #f2e1c799);
  --tv-widget-scale-fill-three: light-dark(#f7e1b6, #e7cda5b3);
  --tv-widget-scale-fill-four: light-dark(#f3d69d, #dcb984cc);
  --tv-widget-scale-fill-five: light-dark(#efcc84, #cfa664e6);
  --tv-widget-scale-fill-six: light-dark(rgba(234, 194, 107, 1), rgba(194, 147, 67, 1));
  --tv-widget-map-hover-stroke-color: rgba(203, 148, 52, 1);
}

    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      display: flex;
      align-items: stretch;
      padding: 1px;
    }

    tv-market-summary {
      flex: 1;
      width: 50%;
      min-height: 50vh;
    }
  </style>
</head>
<body>
  <tv-market-summary
    symbol-sectors='[{"sectionName":"Indices","symbols":["FOREXCOM:SPXUSD","FOREXCOM:DJI","ICMARKETS:STOXX50","SPREADEX:NIKKEI","SSE:000300","RUS:IRUS"]},{"sectionName":"Futures","symbols":["ACTIVTRADES:BRENTQ2026","ACTIVTRADES:NGASN2026","ACTIVTRADES:GASOLN2026","CMCMARKETS:CORNN2026","CMCMARKETS:GOLDQ2026","CMCMARKETS:SILVERN2026"]},{"sectionName":"ElecTech Stocks","symbols":["NASDAQ:AAPL","NASDAQ:NVDA","NASDAQ:INTC","NASDAQ:AMD","NYSE:TSM","NYSE:DELL"]},{"sectionName":"TechServ Stocks","symbols":["NASDAQ:MSFT","NASDAQ:GOOGL","NASDAQ:META","NYSE:IBM","NYSE:SNOW","NYSE:ORCL"]},{"sectionName":"Finance Stocks & Funds","symbols":["NYSE:JPM","NYSE:BAC","NYSE:C","NYSE:BKT","AMEX:VT","NASDAQ:PCPI"]}]'
    time-frame="7D" 
    show-time-range
    layout-mode="grid"
    mode="custom"
  ></tv-market-summary>
  <script type="module" src="https://widgets.tradingview-widget.com/w/en/tv-market-summary.js"></script>
</body>
</html>
