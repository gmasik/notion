<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Market Summary</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      color-scheme: light dark;
      --tv-widget-accent-color: rgba(203, 148, 52, 1);
      --tv-widget-link-color: rgba(203, 148, 52, 1);
      --tv-widget-focus-outline-color: rgba(203, 148, 52, 1);
      --tv-widget-positive-color: rgba(26, 152, 80, 1);
      --tv-widget-positive-area-top-color: rgba(26, 152, 80, 0.4);
      --tv-widget-positive-area-bottom-color: rgba(26, 152, 80, 0.1);
      --tv-widget-negative-color: rgba(184, 30, 62, 1);
      --tv-widget-negative-area-top-color: rgba(184, 30, 62, 0.4);
      --tv-widget-negative-area-bottom-color: rgba(184, 30, 62, 0.1);
      --tv-widget-selected-border-color: light-dark(rgba(156, 156, 156, 1), #9c9c9c);
      --tv-widget-font-family: Monospace;
      --tv-widget-scale-fill-one: light-dark(rgba(203, 148, 52, 0.2), rgba(203, 148, 52, 0.19));
      --tv-widget-scale-fill-two: light-dark(#cb94345c, #cb94345a);
      --tv-widget-scale-fill-three: light-dark(#cb943485, #cb943483);
      --tv-widget-scale-fill-four: light-dark(#cb9434ad, #cb9434ac);
      --tv-widget-scale-fill-five: #cb9434d6;
      --tv-widget-scale-fill-six: rgba(203, 148, 52, 1);
      --tv-widget-map-hover-stroke-color: rgba(203, 148, 52, 1);
    }

    html, body {
      width: 100%;
      height: 99%;
    }

    body {
      display: flex;
      align-items: stretch;
      padding: 1px;
    }

    tv-market-summary {
      flex: 1;
      width: 100%;
      min-height: 100vh;
    }
  </style>
</head>
<body>
  <tv-market-summary
    symbol-sectors='[{"sectionName":"Indices","symbols":["FOREXCOM:SPXUSD","FOREXCOM:DJI","ICMARKETS:STOXX50","SPREADEX:NIKKEI","SSE:000300","RUS:IRUS"]},{"sectionName":"Futures","symbols":["ACTIVTRADES:BRENTQ2026","ACTIVTRADES:NGASN2026","ACTIVTRADES:GASOLN2026","CMCMARKETS:CORNN2026","CMCMARKETS:GOLDQ2026","CMCMARKETS:SILVERN2026"]},{"sectionName":"Electronic Technology Stocks","symbols":["NASDAQ:AAPL","NASDAQ:NVDA","NASDAQ:INTC","NASDAQ:AMD","NYSE:TSM","NYSE:DELL"]},{"sectionName":"Technology Services Stocks","symbols":["NASDAQ:MSFT","NASDAQ:GOOGL","NASDAQ:META","NYSE:IBM","NYSE:SNOW","NYSE:ORCL"]},{"sectionName":"Finance Stocks & Funds","symbols":["NYSE:JPM","NYSE:BAC","NYSE:C","NYSE:BKT","AMEX:VT","NASDAQ:PCPI"]}]'
    layout-mode="grid"
    mode="custom"
  ></tv-market-summary>
  <script type="module" src="https://widgets.tradingview-widget.com/w/en/tv-market-summary.js"></script>
</body>
</html>
