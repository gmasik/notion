<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Economic Map</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 1px;
    }

:root {
  color-scheme: light dark;
  --tv-widget-accent-color: rgba(203, 148, 52, 1);
  --tv-widget-link-color: rgba(203, 148, 52, 1);
  --tv-widget-focus-outline-color: rgba(203, 148, 52, 1);
  --tv-widget-positive-color: rgba(26, 152, 80, 1);
  --tv-widget-positive-area-top-color: rgba(26, 152, 80, 0.4);
  --tv-widget-positive-area-bottom-color: rgba(26, 152, 80, 0.1);
  --tv-widget-negative-color: rgba(184, 30, 62, 1);
  --tv-widget-negative-area-top-color: rgba(184, 30, 62, 0.4);
  --tv-widget-negative-area-bottom-color: rgba(184, 30, 62, 0.1);
  --tv-widget-selected-border-color: light-dark(rgba(156, 156, 156, 1), #9d9893);
  --tv-widget-font-family: Monospace;
  --tv-widget-scale-fill-one: light-dark(rgba(203, 148, 52, 0.2), rgba(203, 148, 52, 0.19));
  --tv-widget-scale-fill-two: light-dark(#cb94345c, #cb94345a);
  --tv-widget-scale-fill-three: light-dark(#cb943485, #cb943483);
  --tv-widget-scale-fill-four: light-dark(#cb9434ad, #cb9434ac);
  --tv-widget-scale-fill-five: #cb9434d6;
  --tv-widget-scale-fill-six: rgba(203, 148, 52, 1);
  --tv-widget-map-hover-stroke-color: rgba(203, 148, 52, 1);
  --tv-widget-hover-background-color: light-dark(#f2f2f2, #141313);
  --tv-widget-tooltip-background-color: light-dark(#2e2e2e, #e6e4e3);
  --tv-widget-tooltip-text-color: light-dark(#f2f2f2, #2d2c2a);
  --tv-widget-button-quiet-color-hover: light-dark(#f2f2f2, #2d2c2a);
  --tv-widget-button-quiet-color-active: light-dark(#ebebeb, #3b3936);
  --tv-widget-scales-font-color: light-dark(#0f0f0f, #cdcac8);
  --tv-widget-attribution-border-color: light-dark(#ebebeb, #201f1e);
  --tv-widget-border-color: light-dark(#ebebeb, #201f1e);
  --tv-widget-map-empty-fill: light-dark(#f2f2f2, #2d2c2a);
}
    
    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      display: flex;
      align-items: stretch;
    }

    tv-economic-map {
      flex: 1;
      width: 50%;
      min-height: 50vh;
    }
  </style>
</head>
<body>
  <tv-economic-map></tv-economic-map>
  <script type="module" src="https://widgets.tradingview-widget.com/w/en/tv-economic-map.js"></script>
</body>
</html>
